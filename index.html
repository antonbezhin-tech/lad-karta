    document.documentElement.replaceWith(document.importNode(nd.documentElement, true));
    for (const old of [...document.querySelectorAll("script")]) {
      const s = document.createElement("script"); s.textContent = old.textContent; old.replaceWith(s);
    }
  } catch (e) { m.textContent = "Ссылка неполная или устарела."; }
})();
</script>
